[project]
name = "rps"
version = "0.1.0"
description = "Local-first, multimodal, graph+diffusion+RL scientific paper summarizer"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy",
    "networkx",
    "datasets>=2.19,<5",
    "huggingface_hub",
    "requests",
    "tqdm",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
mlx = ["mlx", "mlx-lm", "mlx-vlm"]
parsing = ["docling[vlm]", "grobid-client-python", "lxml"]
graph = ["spacy", "sentence-transformers"]
serving = ["fastapi", "uvicorn[standard]"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
